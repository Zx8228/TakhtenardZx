<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تخته نرد حرفه‌ای آنلاین</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; }
body { background: #12131C; color: white; text-align: center; font-family: Tahoma, sans-serif; margin: 0; padding: 5px; user-select: none; }

/* بخش پروفایل کاربران */
#profiles-bar { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 5px auto; background: #1a1c29; padding: 8px 12px; border-radius: 10px; border: 1px solid #2a2d42; }
.player-card { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.avatar { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 2px solid #fff; }
.avatar.w { background: #f5f5f5; color: #111; }
.avatar.b { background: #222; color: #fff; border-color: #555; }
.active-turn { box-shadow: 0 0 10px #e67e22; border-color: #e67e22 !important; }

/* بخش شبکه و اتصال */
#setup-area { background: #1a1c29; padding: 12px; border-radius: 10px; margin: 5px auto; max-width: 600px; border: 1px solid #2a2d42; }
.btn { padding: 8px 15px; background: #e67e22; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin: 2px; }
.btn-copy { background: #27ae60; }
input { padding: 8px; border-radius: 6px; border: 1px solid #333; width: 140px; text-align: center; background: #0f1017; color: white; }

/* وضعیت بازی */
#status-msg { font-size: 14px; margin: 6px 0; color: #f1c40f; font-weight: bold; min-height: 20px; }

/* زمین بازی و سینی‌ها */
#game-wrapper { display: flex; justify-content: center; align-items: center; max-width: 650px; margin: 0 auto; }
.off-tray { width: 32px; height: 340px; background: #221408; border: 3px solid #3d2209; border-radius: 6px; display: flex; flex-direction: column; align-items: center; padding: 2px; }
#board { width: 90vw; max-width: 540px; height: 340px; background: #8B5A2B; border: 6px solid #3d2209; border-radius: 8px; display: flex; direction: ltr; padding: 4px; position: relative; }

.half { width: 47%; display: flex; gap: 2px; }
.bar { width: 6%; background: #3d2209; margin: 0 1%; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.column { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.point { height: 47%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; cursor: pointer; }
.point.bottom { flex-direction: column-reverse; }
.point.selected { background: rgba(255, 255, 0, 0.4); border-radius: 4px; }
.point.valid-move { background: rgba(46, 204, 113, 0.6); border-radius: 4px; }

.tri { position: absolute; top:0; left:0; right:0; bottom:0; z-index: 0; }
.point.top .tri { clip-path: polygon(0 0, 100% 0, 50% 100%); }
.point.bottom .tri { clip-path: polygon(50% 0, 0 100%, 100% 100%); }
.tri.red { background: #c0392b; } .tri.light { background: #e8d8b0; }

.checker { width: 100%; aspect-ratio: 1; max-width: 24px; border-radius: 50%; z-index: 2; margin: 1px 0; border: 1px solid rgba(0,0,0,.5); box-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
.checker.w { background: radial-gradient(circle at 30% 30%, #ffffff, #ccc); }
.checker.b { background: radial-gradient(circle at 30% 30%, #444, #000); }
.checker.mini { height: 10px; border-radius: 2px; margin: 1px 0; }

/* تاس‌ها */
.dice-area { margin: 8px; }
.dice { display: inline-block; width: 40px; height: 40px; background: white; color: black; font-size: 22px; line-height: 40px; border-radius: 8px; margin: 3px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<div id="profiles-bar">
    <div class="player-card">
        <div class="avatar w" id="avatar-w">؟</div>
        <div><div id="name-w">منتظر بازیکن...</div><small style="color:#aaa">سفید (تاس ۱-۶)</small></div>
    </div>
    <div style="font-weight:bold; color:#e67e22">VS</div>
    <div class="player-card">
        <div><div id="name-b">منتظر بازیکن...</div><small style="color:#aaa">سیاه (تاس ۲۴-۱۹)</small></div>
        <div class="avatar b" id="avatar-b">؟</div>
    </div>
</div>

<div id="setup-area">
    <div id="my-id-display">در حال دريافت کد اتصال...</div>
    <button class="btn btn-copy" onclick="copyId()">کپی کد من</button>
    <hr style="border:0;border-top:1px solid #2a2d42;margin:8px 0">
    <input type="text" id="peer-id-input" placeholder="کد حریف را وارد کن">
    <button class="btn" onclick="connectToFriend()">اتصال و شروع</button>
</div>

<div id="status-msg">در حال بارگذاری...</div>

<div id="game-wrapper">
    <div class="off-tray" id="tray-w"></div>
    <div id="board"></div>
    <div class="off-tray" id="tray-b"></div>
</div>

<div class="dice-area">
    <div id="d1" class="dice">؟</div><div id="d2" class="dice">؟</div>
    <br>
    <button class="btn" id="roll-btn" onclick="handleRollBtn()">پرتاب تاس</button>
</div>

<script>
let peer = new Peer(), conn = null, myColor = null, myId = "";
let myName = prompt("نام خود را وارد کنید:", "بازیکن") || "بازیکن";
let names = { w: "سفید", b: "سیاه" };

let gameState = 'CONNECTING'; // CONNECTING, OPENING_ROLL, PLAYING, GAMEOVER
let openingDice = { w: null, b: null };

let board = Array(24).fill(null).map(() => ({ color: null, count: 0 }));
let bar = { w: 0, b: 0 };
let off = { w: 0, b: 0 };
let turn = 'w';
let diceMoves = [];
let selectedIndex = null;
let validMoves = [];
let hitInHomeThisTurn = null; // برای قانون کشتن و فرار ممنوع

peer.on('open', id => {
    myId = id;
    document.getElementById('my-id-display').innerText = "کد اختصاصی شما: " + id;
    setStatus("کد خود را برای حریف بفرستید یا کد او را وارد کنید.");
});

function copyId() { navigator.clipboard.writeText(myId); alert("کد اتصال کپی شد!"); }

peer.on('connection', c => {
    conn = c; myColor = 'w'; names.w = myName;
    setupConn();
    conn.send({ type: 'INIT_NAME', name: myName });
});

function connectToFriend() {
    let fid = document.getElementById('peer-id-input').value;
    if(!fid) return alert("لطفا کد حریف را وارد کنید");
    conn = peer.connect(fid); myColor = 'b'; names.b = myName;
    setupConn();
}

function setupConn() {
    conn.on('open', () => {
        document.getElementById('setup-area').style.display = 'none';
        if(myColor === 'b') conn.send({ type: 'INIT_NAME', name: myName });
        gameState = 'OPENING_ROLL';
        setStatus("برای تعیین شروع‌کننده، تاس پرتاب کنید!");
        updateProfiles();
    });

    conn.on('data', data => {
        if(data.type === 'INIT_NAME') {
            if(myColor === 'w') names.b = data.name;
            else names.w = data.name;
            updateProfiles();
        }
        else if(data.type === 'OPENING_ROLL') {
            openingDice[data.color] = data.val;
            document.getElementById(data.color === 'w' ? 'd1' : 'd2').innerText = data.val;
            checkOpeningRoll();
        }
        else if(data.type === 'GAME_SYNC') {
            board = data.board; bar = data.bar; off = data.off;
            turn = data.turn; diceMoves = data.diceMoves;
            document.getElementById('d1').innerText = data.d1 || '?';
            document.getElementById('d2').innerText = data.d2 || '?';
            checkMarsOrWin();
            build();
        }
    });
}

function setStatus(msg) { document.getElementById('status-msg').innerText = msg; }

function updateProfiles() {
    document.getElementById('name-w').innerText = names.w;
    document.getElementById('avatar-w').innerText = names.w[0] || 'W';
    document.getElementById('name-b').innerText = names.b;
    document.getElementById('avatar-b').innerText = names.b[0] || 'B';
    
    document.getElementById('avatar-w').classList.toggle('active-turn', turn === 'w' && gameState === 'PLAYING');
    document.getElementById('avatar-b').classList.toggle('active-turn', turn === 'b' && gameState === 'PLAYING');
}

// چیدمان اولیه
function set(p, c, n) { board[p-1] = { color: c, count: n }; }
function initBoard() {
    board = Array(24).fill(null).map(() => ({ color: null, count: 0 }));
    set(1, 'b', 2); set(6, 'w', 5); set(8, 'w', 3); set(12, 'b', 5);
    set(13, 'w', 5); set(17, 'b', 3); set(19, 'b', 5); set(24, 'w', 2);
}
initBoard();

function handleRollBtn() {
    if(gameState === 'OPENING_ROLL') {
        if(openingDice[myColor] !== null) return alert("شما تاس تعیین شروع را ریخته‌اید!");
        let rollVal = Math.floor(Math.random() * 6) + 1;
        openingDice[myColor] = rollVal;
        document.getElementById(myColor === 'w' ? 'd1' : 'd2').innerText = rollVal;
        conn.send({ type: 'OPENING_ROLL', color: myColor, val: rollVal });
        checkOpeningRoll();
    }
    else if(gameState === 'PLAYING') {
        if(turn !== myColor) return alert("نوبت حریف است!");
        if(diceMoves.length > 0) return alert("ابتدا حرکت‌های تاس قبلی را انجام دهید!");
        
        let d1 = Math.floor(Math.random() * 6) + 1;
        let d2 = Math.floor(Math.random() * 6) + 1;
        
        // جفت = ۴ حرکت
        diceMoves = (d1 === d2) ? [d1, d1, d1, d1] : [d1, d2];
        
        document.getElementById('d1').innerText = d1;
        document.getElementById('d2').innerText = d2;
        hitInHomeThisTurn = null;
        
        syncGame(d1, d2);
    }
}

function checkOpeningRoll() {
    if(openingDice.w !== null && openingDice.b !== null) {
        if(openingDice.w === openingDice.b) {
            setStatus("تاس‌ها برابر شد! دوباره تاس بریزید.");
            openingDice = { w: null, b: null };
        } else {
            turn = openingDice.w > openingDice.b ? 'w' : 'b';
            diceMoves = [openingDice.w, openingDice.b];
            gameState = 'PLAYING';
            setStatus(`بازیکن ${names[turn]} شروع‌کننده است!`);
            updateProfiles();
            build();
        }
    }
}

function build() {
    let b = document.getElementById('board'); b.innerHTML = '';
    b.appendChild(makeHalf([13,14,15,16,17,18], [12,11,10,9,8,7]));
    
    // پیشخوان وسط
    let barDiv = document.createElement('div'); barDiv.className = 'bar';
    for(let i=0; i<bar.w; i++) { let c = document.createElement('div'); c.className='checker w'; barDiv.appendChild(c); }
    for(let i=0; i<bar.b; i++) { let c = document.createElement('div'); c.className='checker b'; barDiv.appendChild(c); }
    b.appendChild(barDiv);

    b.appendChild(makeHalf([19,20,21,22,23,24], [6,5,4,3,2,1]));

    // سینی خروجی‌ها
    let tw = document.getElementById('tray-w'); tw.innerHTML = '';
    for(let i=0; i<off.w; i++){ let c = document.createElement('div'); c.className='checker mini w'; tw.appendChild(c); }
    let tb = document.getElementById('tray-b'); tb.innerHTML = '';
    for(let i=0; i<off.b; i++){ let c = document.createElement('div'); c.className='checker mini b'; tb.appendChild(c); }
    
    updateProfiles();
}

function makeHalf(tops, bots) {
    let h = document.createElement('div'); h.className = 'half';
    for (let i = 0; i < 6; i++) {
        let col = document.createElement('div'); col.className = 'column';
        col.appendChild(makePoint(tops[i], 'top')); col.appendChild(makePoint(bots[i], 'bottom'));
        h.appendChild(col);
    } return h;
}

function makePoint(p, pos) {
    let idx = p - 1; let d = document.createElement('div');
    d.className = 'point ' + pos + (selectedIndex === idx ? ' selected' : '') + (validMoves.includes(idx) ? ' valid-move' : '');
    d.onclick = () => handleClick(idx);
    let tri = document.createElement('div'); tri.className = 'tri ' + (p % 2 == 0 ? 'red' : 'light');
    d.appendChild(tri);
    let st = board[idx];
    for (let k = 0; k < st.count; k++) {
        let c = document.createElement('div'); c.className = 'checker ' + st.color; d.appendChild(c);
    } return d;
}

function handleClick(idx) {
    if (turn !== myColor || gameState !== 'PLAYING' || diceMoves.length === 0) return;
    
    // اگر مهره خورده شده داریم
    if (bar[turn] > 0) {
        enterFromBar(idx);
        return;
    }

    if (selectedIndex === null) {
        if (board[idx].color === turn) {
            // قانون فرار ممنوع: اگر این همان مهره‌ای است که در خانه خودی حریف را زده، نباید فرار کند
            if (hitInHomeThisTurn === idx) {
                alert("طبق قانون (فرار ممنوع)، نمی‌توانید مهره‌ای که در خانه خودی حریف را زده بلافاصله فرار دهید!");
                return;
            }
            selectedIndex = idx; calculateValidMoves(idx);
        }
    } else {
        if (validMoves.includes(idx)) {
            executeMove(selectedIndex, idx);
            selectedIndex = null; validMoves = [];
            syncGame();
        } else { selectedIndex = null; validMoves = []; }
    }
    build();
}

function enterFromBar(targetIdx) {
    let step = turn === 'w' ? (24 - targetIdx) : (targetIdx + 1);
    let diceIdx = diceMoves.indexOf(step);
    if (diceIdx !== -1) {
        if (board[targetIdx].count <= 1 || board[targetIdx].color === turn) {
            if (board[targetIdx].count === 1 && board[targetIdx].color !== turn) {
                bar[board[targetIdx].color]++;
                board[targetIdx].count = 0;
            }
            board[targetIdx].color = turn;
            board[targetIdx].count++;
            bar[turn]--;
            diceMoves.splice(diceIdx, 1);
            syncGame();
        }
    }
}

function calculateValidMoves(f) {
    validMoves = [];
    let dir = turn === 'w' ? -1 : 1;
    let canBear = checkCanBearOff();

    diceMoves.forEach(s => {
        let t = f + (s * dir);
        if (t >= 0 && t < 24) {
            if (board[t].count <= 1 || board[t].color === turn) validMoves.push(t);
        } else if (canBear) {
            // امکان بیرون بردن
            if ((turn === 'w' && f + 1 === s) || (turn === 'b' && 24 - f === s)) {
                bearOffPiece(f, s);
            }
        }
    });
}

function checkCanBearOff() {
    if (bar[turn] > 0) return false;
    let start = turn === 'w' ? 0 : 18, end = turn === 'w' ? 5 : 23, count = 0;
    for (let i = start; i <= end; i++) {
        if (board[i].color === turn) count += board[i].count;
    }
    return (count + off[turn]) === 15;
}

function bearOffPiece(fromIdx, diceVal) {
    board[fromIdx].count--;
    if (board[fromIdx].count === 0) board[fromIdx].color = null;
    off[turn]++;
    diceMoves.splice(diceMoves.indexOf(diceVal), 1);
    syncGame();
}

function executeMove(f, t) {
    let step = Math.abs(t - f);
    diceMoves.splice(diceMoves.indexOf(step), 1);
    
    let isHomeBoard = turn === 'w' ? (t >= 0 && t <= 5) : (t >= 18 && t <= 23);

    // زدن مهره
    if (board[t].count === 1 && board[t].color !== turn) {
        bar[board[t].color]++;
        board[t].count = 0;
        // ثبت قانون فرار ممنوع اگر در خانه خودی باشد
        if (isHomeBoard) hitInHomeThisTurn = t;
    }

    board[t].color = turn; board[t].count++;
    board[f].count--; if (board[f].count === 0) board[f].color = null;
}

function syncGame(d1Val, d2Val) {
    if (diceMoves.length === 0) {
        turn = turn === 'w' ? 'b' : 'w';
        hitInHomeThisTurn = null;
    }
    
    checkMarsOrWin();

    if (conn) {
        conn.send({
            type: 'GAME_SYNC',
            board: board, bar: bar, off: off, turn: turn,
            diceMoves: diceMoves,
            d1: d1Val || document.getElementById('d1').innerText,
            d2: d2Val || document.getElementById('d2').innerText
        });
    }
    build();
}

function checkMarsOrWin() {
    if (off.w === 15 || off.b === 15) {
        gameState = 'GAMEOVER';
        let winner = off.w === 15 ? names.w : names.b;
        let loserOff = off.w === 15 ? off.b : off.w;
        if (loserOff === 0) {
            setStatus(`🏆 ${winner} برنده شد! (مارس - ۲ برابر امتیاز) 🎉`);
            alert(`مارس! ${winner} با اقتدار برنده شد!`);
        } else {
            setStatus(`🏆 ${winner} برنده بازی شد! 🎉`);
            alert(`تبریک! ${winner} برنده شد.`);
        }
    }
}

build();
</script>
</body>
</html>
