<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تخته نرد آنلاین</title>
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; }
        #board { 
            width: 320px; height: 400px; background: #8b5a2b; 
            margin: 20px auto; border: 5px solid #4a2e12; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .dice-box { font-size: 30px; margin: 20px; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #e67e22; border: none; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>بازی تخته نرد</h1>
    <div id="board">محل قرارگیری مهره‌ها</div>
    <div class="dice-box">
        <span id="d1">🎲</span>
        <span id="d2">🎲</span>
    </div>
    <button onclick="roll()">پرتاب تاس</button>

    <script>
        function roll() {
            document.getElementById('d1').innerText = Math.floor(Math.random() * 6) + 1;
            document.getElementById('d2').innerText = Math.floor(Math.random() * 6) + 1;
        }
    </script>
</body>
</html>
