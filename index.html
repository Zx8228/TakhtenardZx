<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تخته نرد حرفه‌ای آنلاین</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 30%,#4a2f1d,#1b0f08);color:#fff;text-align:center;font-family:Tahoma;margin:0;padding:0;user-select:none;touch-action:manipulation;min-height:100vh;overflow-x:hidden}
/* دکمه‌های گوشه */
.corner-btns{position:fixed;top:8px;right:8px;z-index:50;display:flex;gap:8px}
.gold-btn{width:44px;height:44px;border-radius:50%;border:2px solid #8a6d1d;background:radial-gradient(circle at 35% 30%,#ffe27a,#e6a817 60%,#a86f00);font-size:20px;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
/* چیدمان اصلی */
#game{display:flex;justify-content:center;align-items:stretch;gap:6px;padding:8px;max-width:720px;margin:0 auto;min-height:92vh}
.panel{width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;background:rgba(0,0,0,.35);border-radius:12px;border:1px solid #5a3a1a}
.pname{font-size:11px;font-weight:bold;background:#0d3b66;padding:4px 6px;border-radius:8px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{background:#111;padding:4px;border-radius:8px;font-size:14px;font-weight:bold;color:#ffd700;width:100%}
.dice-row{display:flex;gap:4px}
.dbox{width:26px;height:30px;background:linear-gradient(#3a3a3a,#1a1a1a);border-radius:6px;border:1px solid #555;font-size:18px;line-height:30px}
.avatar{width:56px;height:56px;border-radius:50%;background:#222;border:3px solid #c9a227;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.avatar .flag{position:absolute;bottom:-4px;right:-6px;font-size:14px}
.avatar.glow{box-shadow:0 0 14px 4px #2ecc71}
.offcount{font-size:11px;color:#ccc}
.toggle{font-size:10px;color:#ddd;display:flex;flex-direction:column;gap:2px;align-items:center}
/* قاب تخته */
#board-frame{flex:1;max-width:480px;background:linear-gradient(#f6e3b4,#d4af6e);border-radius:12px;padding:6px;box-shadow:0 0 25px rgba(0,0,0,.7),inset 0 0 0 2px #7a5a2a;display:flex;position:relative}
.tray{width:9%;background:linear-gradient(90deg,#0a0a0a,#222 50%,#0a0a0a);border-radius:6px;display:flex;flex-direction:column;align-items:center;padding:4px 1px;gap:2px;box-shadow:inset 0 0 8px #000}
#board{flex:1;background:linear-gradient(#e8c88f,#cf9d5c);border-radius:6px;display:flex;direction:ltr;padding:4px;position:relative;box-shadow:inset 0 0 15px rgba(90,50,10,.4)}
.half{width:47%;display:flex;gap:2px}
.bar{width:7%;background:linear-gradient(90deg,#222,#555 50%,#222);margin:0 1%;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 0 5px #000}
.column{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.point{height:46%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer}
.point.bottom{flex-direction:column-reverse}
.point.selected{outline:3px solid #ff0;outline-offset:-3px;border-radius:4px}
.point.valid-move::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:#2ecc71;border-radius:50%;z-index:5;box-shadow:0 0 8px #2ecc71;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.tri{position:absolute;top:0;left:1px;right:1px;bottom:0;z-index:0;border-radius:4px;box-shadow:inset 0 0 6px rgba(0,0,0,.4)}
.tri.a{background:repeating-linear-gradient(45deg,#3d85a8,#3d85a8 4px,#2b6a88 4px,#2b6a88 8px)}
.tri.b{background:repeating-linear-gradient(45deg,#5a3a1a,#5a3a1a 4px,#452c10 4px,#452c10 8px)}
.checker{width:100%;aspect-ratio:1;max-width:30px;border-radius:50%;z-index:2;margin:1px 0;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:1px 1px 3px rgba(0,0,0,.6)}
.checker::after{content:'✿';font-size:12px;opacity:.5}
.checker.w{background:radial-gradient(circle at 35% 30%,#8fffb0,#1db954 55%,#0a5c28);border:2px solid #0a3d91;color:#043}
.checker.b{background:radial-gradient(circle at 35% 30%,#ffd27a,#ff8c1a 55%,#b3371f);border:2px solid #7a0d0d;color:#631}
.checker.mini{max-width:none;width:90%;height:12px;border-radius:3px;margin:1px 0}
.checker.mini::after{display:none}
/* دکمه سبز وسط تخته */
#roll-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;display:none}
#roll-overlay button{background:linear-gradient(#5ee05e,#1e9e1e);border:2px solid #0a5c0a;color:#fff;font-family:Tahoma;font-weight:bold;font-size:18px;padding:12px 24px;border-radius:12px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5);animation:pulse 1.2s infinite}
/* دکمه‌های پایین */
#undo-btn{position:fixed;bottom:10px;left:10px;z-index:50}
#chat-btn{position:fixed;bottom:10px;right:10px;z-index:50}
#chat-panel{position:fixed;bottom:64px;right:10px;z-index:60;background:#16213e;border:1px solid #c9a227;border-radius:10px;padding:8px;display:none;flex-direction:column;gap:5px}
#chat-panel button{background:#0f3460;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-family:Tahoma;cursor:pointer}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#c9a227;color:#111;padding:8px 16px;border-radius:20px;font-weight:bold;display:none;z-index:70;box-shadow:0 3px 10px rgba(0,0,0,.5)}
/* مودال‌ها */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center}
.modal .box{background:#1a1c29;border:2px solid #c9a227;border-radius:14px;padding:20px;width:85%;max-width:320px;text-align:center}
.modal input{padding:8px;border-radius:6px;border:1px solid #444;background:#0f1017;color:#fff;width:80%;text-align:center;margin:6px 0}
.btn{padding:9px 16px;background:#e67e22;color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:Tahoma;font-weight:bold;margin:4px}
.btn-green{background:#27ae60}
#status-msg{position:fixed;top:8px;left:50%;transform:translateX(-50%);font-size:13px;color:#ffd700;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:12px;z-index:40}
@media(max-width:420px){.panel{width:60px}.avatar{width:46px;height:46px;font-size:22px}}
</style>
</head>
<body>

<div class="corner-btns">
    <button class="gold-btn" onclick="changeName()">⚙️</button>
    <button class="gold-btn" onclick="if(confirm('خروج از بازی؟'))location.reload()">➜</button>
</div>

<div id="status-msg">در حال اتصال...</div>

<div id="game">
    <!-- پنل حریف -->
    <div class="panel">
        <div class="pname" id="opp-name">حریف</div>
        <div class="score" id="opp-score">۰</div>
        <div class="dice-row"><div class="dbox" id="od1"></div><div class="dbox" id="od2"></div></div>
        <div class="avatar" id="av-opp">؟<span class="flag">🇮🇷</span></div>
        <div class="offcount" id="opp-off">خارج: ۰</div>
    </div>

    <!-- تخته -->
    <div id="board-frame">
        <div class="tray" id="tray-w"></div>
        <div id="board">
            <div id="roll-overlay"><button onclick="doRoll()">تاس بریزید 🎲</button></div>
        </div>
        <div class="tray" id="tray-b"></div>
    </div>

    <!-- پنل من -->
    <div class="panel">
        <div class="pname" id="me-name">من</div>
        <div class="score" id="me-score">۰</div>
        <div class="dice-row"><div class="dbox" id="md1"></div><div class="dbox" id="md2"></div></div>
        <div class="avatar" id="av-me">؟<span class="flag">🇮🇷</span></div>
        <div class="offcount" id="me-off">خارج: ۰</div>
        <label class="toggle"><input type="checkbox" id="auto-roll">تاس خودکار</label>
    </div>
</div>

<button class="gold-btn" id="undo-btn" onclick="undoMove()">↩</button>
<button class="gold-btn" id="chat-btn" onclick="toggleChat()">💬</button>

<div id="chat-panel">
    <button onclick="sendChat('سلام 👋')">سلام 👋</button>
    <button onclick="sendChat('دستت درد نکنه 🙌')">دستت درد نکنه 🙌</button>
    <button onclick="sendChat('حیف شد 😅')">حیف شد 😅</button>
    <button onclick="sendChat('آفرین 👏')">آفرین 👏</button>
    <button onclick="sendChat('بخت باهات یار بود 🎲')">بخت باهات یار بود 🎲</button>
</div>

<div id="toast"></div>

<!-- مودال اتصال -->
<div class="modal" id="setup-modal">
    <div class="box">
        <h3>🎲 تخته نرد آنلاین</h3>
        <div id="my-id-display" style="font-size:12px;word-break:break-all;color:#ffd700">در حال ساخت کد...</div>
        <button class="btn btn-green" onclick="copyId()">📋 کپی کد من</button>
        <hr style="border-color:#333">
        <input type="text" id="peer-id-input" placeholder="کد حریف را اینجا بزن">
        <br>
        <button class="btn" onclick="connectToFriend()">اتصال و شروع بازی</button>
    </div>
</div>

<!-- مودال پایان بازی -->
<div class="modal" id="gameover-modal" style="display:none">
    <div class="box">
        <h2 id="result-text">🏆</h2>
        <button class="btn btn-green" onclick="rematch()">🔄 بازی مجدد</button>
    </div>
</div>

<script>
const DICE_FACES=['','⚀','⚁','⚂','⚃','⚄','⚅'];
const FA=n=>n.toString().replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

let myName=prompt("نام شما:","بازیکن")||"بازیکن";
let myAvatar=prompt("یک ایموجی برای پروفایل خودت:","😎")||"😎";

let peer=new Peer(),conn=null,myColor=null,myId="";
let opp={name:"حریف",avatar:"👤"};
let scores={w:0,b:0};
let gameState='CONNECTING'; // CONNECTING, OPENING, PLAYING, GAMEOVER
let openingDice={w:null,b:null};
let board=Array(24).fill(null).map(()=>({color:null,count:0}));
let bar={w:0,b:0},off={w:0,b:0};
let turn='w',diceMoves=[],selectedIndex=null,validMoves=[];
let hitInHomeThisTurn=null;
let history=[];
let lastRoll=null; // {by, d:[d1,d2]}
let autoRolling=false;

peer.on('open',id=>{myId=id;document.getElementById('my-id-display').innerText="کد شما: "+id;setStatus("کد خود را برای حریف بفرستید");});
function copyId(){navigator.clipboard.writeText(myId);alert("کد کپی شد! برای حریفت بفرست");}

peer.on('connection',c=>{conn=c;myColor='w';setupConn();conn.on('open',()=>conn.send({type:'INIT',name:myName,avatar:myAvatar}));});
function connectToFriend(){
    let fid=document.getElementById('peer-id-input').value.trim();
    if(!fid)return alert("کد حریف را وارد کنید");
    conn=peer.connect(fid);myColor='b';setupConn();
    conn.on('open',()=>conn.send({type:'INIT',name:myName,avatar:myAvatar}));
}

function setupConn(){
    conn.on('data',data=>{
        if(data.type==='INIT'){
            opp.name=data.name;opp.avatar=data.avatar;
            if(document.getElementById('setup-modal'))document.getElementById('setup-modal').style.display='none';
            gameState='OPENING';setStatus("برای شروع، تاس بریزید!");render();
        }
        else if(data.type==='OPEN_ROLL'){
            openingDice[data.color]=data.val;checkOpening();render();
        }
        else if(data.type==='SYNC'){
            board=data.board;bar=data.bar;off=data.off;turn=data.turn;
            diceMoves=data.diceMoves;lastRoll=data.lastRoll;scores=data.scores;
            selectedIndex=null;validMoves=[];autoRolling=false;
            render();maybeAutoRoll();
        }
        else if(data.type==='CHAT'){showToast(opp.name+": "+data.msg);}
        else if(data.type==='REMATCH'){resetGame();}
    });
}

function setStatus(m){document.getElementById('status-msg').innerText=m;}
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function toggleChat(){let p=document.getElementById('chat-panel');p.style.display=p.style.display==='flex'?'none':'flex';}
function sendChat(m){if(conn)conn.send({type:'CHAT',msg:m});showToast("شما: "+m);toggleChat();}
function changeName(){
    myName=prompt("نام جدید:",myName)||myName;
    myAvatar=prompt("ایموجی جدید:",myAvatar)||myAvatar;
    if(conn)conn.send({type:'INIT',name:myName,avatar:myAvatar});render();
}

// چیدمان
function set(p,c,n){board[p-1]={color:c,count:n};}
function initBoard(){
    board=Array(24).fill(null).map(()=>({color:null,count:0}));
    bar={w:0,b:0};off={w:0,b:0};
    set(1,'b',2);set(6,'w',5);set(8,'w',3);set(12,'b',5);
    set(13,'w',5);set(17,'b',3);set(19,'b',5);set(24,'w',2);
}
initBoard();

// تاس
function doRoll(){
    if(!conn)return;
    if(gameState==='OPENING'){
        if(openingDice[myColor]!==null)return;
        let v=Math.floor(Math.random()*6)+1;
        openingDice[myColor]=v;
        conn.send({type:'OPEN_ROLL',color:myColor,val:v});
        checkOpening();render();
    }
    else if(gameState==='PLAYING'){
        if(turn!==myColor||diceMoves.length>0)return;
        let d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
        diceMoves=(d1===d2)?[d1,d1,d1,d1]:[d1,d2];
        lastRoll={by:myColor,d:[d1,d2]};
        hitInHomeThisTurn=null;history=[];
        sync();
    }
}

function checkOpening(){
    if(openingDice.w&&openingDice.b){
        if(openingDice.w===openingDice.b){openingDice={w:null,b:null};setStatus("مساوی شد! دوباره");}
        else{
            turn=openingDice.w>openingDice.b?'w':'b';
            diceMoves=[openingDice.w,openingDice.b];
            lastRoll={by:turn,d:[openingDice.w,openingDice.b]};
            gameState='PLAYING';
            setStatus(turn===myColor?"شما شروع می‌کنید!":"حریف شروع می‌کند");
        }
    }
}

function maybeAutoRoll(){
    let auto=document.getElementById('auto-roll').checked;
    if(!auto||autoRolling)return;
    let needRoll=(gameState==='OPENING'&&openingDice[myColor]===null)||(gameState==='PLAYING'&&turn===myColor&&diceMoves.length===0);
    if(needRoll){autoRolling=true;setTimeout(()=>{doRoll();autoRolling=false;},900);}
}
document.addEventListener('change',e=>{if(e.target.id==='auto-roll')maybeAutoRoll();});

// کلیک روی خانه‌ها
function handleClick(idx){
    if(turn!==myColor||gameState!=='PLAYING'||diceMoves.length===0)return;
    if(bar[turn]>0){enterFromBar(idx);return;}
    if(selectedIndex===null){
        if(board[idx].color===turn){
            if(hitInHomeThisTurn===idx){showToast("⛔ فرار ممنوع! مهره‌ای که در خانه خودی زده‌اید نمی‌تواند فرار کند");return;}
            selectedIndex=idx;calcValid(idx);
        }
    }else{
        if(validMoves.includes(idx)){execMove(selectedIndex,idx);selectedIndex=null;validMoves=[];sync();}
        else if(board[idx].color===turn){
            if(hitInHomeThisTurn===idx){showToast("⛔ فرار ممنوع!");return;}
            selectedIndex=idx;calcValid(idx);
        }
        else{selectedIndex=null;validMoves=[];}
    }
    render();
}

function enterFromBar(t){
    let step=turn==='w'?(24-t):(t+1);
    let di=diceMoves.indexOf(step);
    if(di===-1)return;
    if(board[t].count>1&&board[t].color!==turn)return;
    snapshot();
    if(board[t].count===1&&board[t].color!==turn){bar[board[t].color]++;board[t].count=0;}
    board[t].color=turn;board[t].count++;bar[turn]--;
    diceMoves.splice(di,1);sync();
}

function calcValid(f){
    validMoves=[];
    let dir=turn==='w'?-1:1;
    let canBear=checkCanBear();
    diceMoves.forEach(s=>{
        let t=f+(s*dir);
        if(t>=0&&t<24){if(board[t].count<=1||board[t].color===turn)validMoves.push(t);}
        else if(canBear){
            if((turn==='w'&&f+1===s)||(turn==='b'&&24-f===s)){bearOff(f,s);}
        }
    });
}

function checkCanBear(){
    if(bar[turn]>0)return false;
    let st=turn==='w'?0:18,en=turn==='w'?5:23,c=0;
    for(let i=st;i<=en;i++)if(board[i].color===turn)c+=board[i].count;
    return(c+off[turn])===15;
}

function bearOff(f,s){
    snapshot();
    board[f].count--;if(board[f].count===0)board[f].color=null;
    off[turn]++;diceMoves.splice(diceMoves.indexOf(s),1);
    selectedIndex=null;validMoves=[];sync();
}

function execMove(f,t){
    snapshot();
    let step=Math.abs(t-f);
    diceMoves.splice(diceMoves.indexOf(step),1);
    let isHome=turn==='w'?(t>=0&&t<=5):(t>=18&&t<=23);
    if(board[t].count===1&&board[t].color!==turn){
        bar[board[t].color]++;board[t].count=0;
        if(isHome)hitInHomeThisTurn=t;
    }
    board[t].color=turn;board[t].count++;
    board[f].count--;if(board[f].count===0)board[f].color=null;
}

function snapshot(){history.push(JSON.stringify({board,bar,off,diceMoves,hitInHomeThisTurn}));}
function undoMove(){
    if(turn!==myColor||gameState!=='PLAYING'||history.length===0){showToast("چیزی برای برگشت نیست");return;}
    let s=JSON.parse(history.pop());
    board=s.board;bar=s.bar;off=s.off;diceMoves=s.diceMoves;hitInHomeThisTurn=s.hitInHomeThisTurn;
    selectedIndex=null;validMoves=[];sync();showToast("↩ برگشت");
}

function sync(){
    if(diceMoves.length===0&&lastRoll){turn=turn==='w'?'b':'w';hitInHomeThisTurn=null;lastRoll=null;history=[];}
    checkGameOver();
    if(conn)conn.send({type:'SYNC',board,bar,off,turn,diceMoves,lastRoll,scores});
    render();
}

function checkGameOver(){
    if(off.w===15||off.b===15){
        gameState='GAMEOVER';
        let winner=off.w===15?'w':'b';
        let mars=(winner==='w'?off.b:off.w)===0;
        scores[winner]+=mars?2:1;
        let wName=winner===myColor?myName:opp.name;
        document.getElementById('result-text').innerHTML=mars?("🏆 "+wName+"<br><span style='color:#ffd700'>مارس! +۲ امتیاز</span>"):("🏆 "+wName+" برنده شد! +۱ امتیاز");
        document.getElementById('gameover-modal').style.display='flex';
    }
}

function rematch(){
    if(conn)conn.send({type:'REMATCH'});
    resetGame();
}
function resetGame(){
    document.getElementById('gameover-modal').style.display='none';
    initBoard();openingDice={w:null,b:null};diceMoves=[];lastRoll=null;history=[];
    selectedIndex=null;validMoves=[];hitInHomeThisTurn=null;
    gameState='OPENING';setStatus("برای شروع، تاس بریزید!");render();
}

// رندر
function render(){
    // تخته
    let b=document.getElementById('board');
    b.querySelectorAll('.half,.bar').forEach(e=>e.remove());
    // اگر مهره روی بار داریم، خانه‌های ورود مجاز را نشان بده
    if(gameState==='PLAYING'&&turn===myColor&&bar[turn]>0&&diceMoves.length>0){
        validMoves=[];
        diceMoves.forEach(s=>{let t=turn==='w'?24-s:s-1;if(board[t].count<=1||board[t].color===turn)validMoves.push(t);});
    }
    b.insertBefore(makeHalf([13,14,15,16,17,18],[12,11,10,9,8,7]),b.firstChild);
    let barDiv=document.createElement('div');barDiv.className='bar';
    for(let i=0;i<bar.w;i++){let c=document.createElement('div');c.className='checker w';barDiv.appendChild(c);}
    for(let i=0;i<bar.b;i++){let c=document.createElement('div');c.className='checker b';barDiv.appendChild(c);}
    b.appendChild(barDiv);
    b.appendChild(makeHalf([19,20,21,22,23,24],[6,5,4,3,2,1]));
    // سینی‌ها
    let tw=document.getElementById('tray-w');tw.innerHTML='';
    for(let i=0;i<off.w;i++){let c=document.createElement('div');c.className='checker mini w';tw.appendChild(c);}
    let tb=document.getElementById('tray-b');tb.innerHTML='';
    for(let i=0;i<off.b;i++){let c=document.createElement('div');c.className='checker mini b';tb.appendChild(c);}
    // پنل‌ها
    let oppColor=myColor==='w'?'b':'w';
    document.getElementById('me-name').innerText=myName;
    document.getElementById('opp-name').innerText=opp.name;
    document.getElementById('av-me').childNodes[0].textContent=myAvatar;
    document.getElementById('av-opp').childNodes[0].textContent=opp.avatar;
