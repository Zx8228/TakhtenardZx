<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تخته نرد آنلاین</title>
    <style>
        body { background: #1a1a2e; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        #board {
            width: 95vw; max-width: 600px; height: 350px;
            background: #8b5a2b; border: 10px solid #3d2209;
            margin: 10px auto; position: relative; display: flex; justify-content: space-between;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .half { width: 45%; height: 100%; display: flex; justify-content: space-around; }
        .column { width: 30px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .point-up { width: 0; height: 140px; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 140px solid #c0392b; }
        .point-down { width: 0; height: 140px; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 140px solid #27ae60; }
        .bar { width: 15px; background: #3d2209; height: 100%; position: absolute; left: 50%; transform: translateX(-50%); z-index: 10; }
        .dice-box { margin: 20px; }
        .dice { display: inline-block; width: 60px; height: 60px; background: white; color: black; font-size: 35px; line-height: 60px; border-radius: 10px; margin: 10px; font-weight: bold; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        button { padding: 15px 40px; font-size: 20px; background: #e67e22; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d35400; }
    </style>
</head>
<body>
    <h1>🎲 تخته نرد حرفه‌ای (نسخه اولیه)</h1>
    <div id="board">
        <div class="bar"></div>
        <div class="half">
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
        </div>
        <div class="half">
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
            <div class="column"><div class="point-up"></div><div class="point-down"></div></div>
        </div>
    </div>
    <div class="dice-box">
        <div id="d1" class="dice">؟</div>
        <div id="d2" class="dice">؟</div>
    </div>
    <button onclick="roll()">پرتاب تاس</button>
    <script>
        function roll() {
            let roll1 = Math.floor(Math.random() * 6) + 1;
            let roll2 = Math.floor(Math.random() * 6) + 1;
            document.getElementById('d1').innerText = roll1;
            document.getElementById('d2').innerText = roll2;
        }
    </script>
</body>
</html>
