<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تخته نرد حرفه‌ای آنلاین</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;padding:0;background:#26130a url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='130'><g fill='none' stroke='%23341b0c' stroke-width='2'><circle cx='65' cy='65' r='16'/><path d='M65 20 q10 16 0 28 q-10 -12 0 -28'/><path d='M65 110 q10 -16 0 -28 q-10 12 0 28'/><path d='M20 65 q16 10 28 0 q-12 -10 -28 0'/><path d='M110 65 q-16 10 -28 0 q16 -10 28 0'/><circle cx='18' cy='18' r='7'/><circle cx='112' cy='112' r='7'/><circle cx='112' cy='18' r='7'/><circle cx='18' cy='112' r='7'/></g></svg>") repeat;background-size:130px 130px;color:#fff;text-align:center;font-family:Tahoma;user-select:none;touch-action:manipulation}
/* ===== بازی برای همیشه افقی ===== */
#rotator{position:absolute;top:0;left:0;width:100%;height:100%}
@media (orientation:portrait){
  #rotator{top:50%;left:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
}
/* دکمه‌های گوشه */
.corner-btns{position:absolute;top:8px;right:8px;z-index:50;display:flex;gap:8px}
.gold-btn{width:46px;height:46px;border-radius:50%;border:2px solid #8a6d1d;background:radial-gradient(circle at 35% 30%,#ffe27a,#e6a817 60%,#a86f00);font-size:20px;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
/* چیدمان اصلی افقی */
#game{display:flex;justify-content:center;align-items:stretch;gap:6px;padding:34px 6px 32px;height:100%;max-width:1200px;margin:0 auto}
.panel{width:11%;min-width:80px;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 4px}
.pname{font-size:11px;font-weight:bold;color:#fff;padding:4px 6px;border-radius:4px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.panel.me .pname{background:linear-gradient(#4fc3f7,#1976d2)}
.panel.opp .pname{background:linear-gradient(#ef5350,#b71c1c)}
.score{background:#101010;border:1px solid #3a3a3a;border-radius:6px;padding:3px 4px;font-size:13px;font-weight:bold;color:#fff;width:92%}
.dice-row{display:flex;gap:4px;background:#191919;border:1px solid #454545;border-radius:9px;padding:4px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.dbox{width:27px;height:27px;background:linear-gradient(#9a9a9a,#6a6a6a);border-radius:6px;border:1px solid #3a3a3a;font-size:17px;line-height:27px;color:#1c1c1c}
.avatar{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 50% 32%,#4a2c17,#201007);border:2px solid #8a5a2a;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;box-shadow:0 6px 0 -2px #c9861f,0 9px 12px rgba(0,0,0,.55)}
.avatar .flag{position:absolute;bottom:-6px;right:-8px;font-size:10px;font-weight:bold;background:radial-gradient(circle at 35% 30%,#9ed1ff,#1976d2);border:1.5px solid #fff;color:#fff;border-radius:10px;padding:1px 5px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.avatar.glow{box-shadow:0 6px 0 -2px #c9861f,0 0 16px 5px #2ecc71}
.offcount{font-size:11px;font-weight:bold;color:#222;background:linear-gradient(#ded8c6,#b9b29c);border-radius:7px;padding:4px 8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.4)}
.toggle{font-size:10px;color:#eee;display:flex;flex-direction:column;gap:3px;align-items:center;background:#161616;border:1px solid #3d3d3d;border-radius:9px;padding:5px 9px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
/* قاب تخته */
#board-frame{flex:1;min-width:0;background:linear-gradient(#efd7a2,#c9a25f);border-radius:12px;padding:6px;box-shadow:0 0 25px rgba(0,0,0,.7),inset 0 0 0 2px #7a5a2a;display:flex;position:relative}
.tray{width:8%;border-radius:6px;display:flex;flex-direction:column;align-items:center;padding:4px 1px;gap:2px;box-shadow:inset 0 0 8px #000;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='5' fill='%23e9dab3'/><path d='M20 5 L35 20 L20 35 L5 20 Z' fill='none' stroke='%231f7a70' stroke-width='3'/><path d='M20 13 L27 20 L20 27 L13 20 Z' fill='%231f7a70'/></svg>") center 26%/62% auto no-repeat,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='5' fill='%23e9dab3'/><path d='M20 5 L35 20 L20 35 L5 20 Z' fill='none' stroke='%231f7a70' stroke-width='3'/><path d='M20 13 L27 20 L20 27 L13 20 Z' fill='%231f7a70'/></svg>") center 74%/62% auto no-repeat,linear-gradient(90deg,#0a0a0a,#242424 50%,#0a0a0a)}
#board{flex:1;background:#ecd7ab url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><g fill='none' stroke='%23d9a75f' stroke-width='1.5' opacity='.55'><path d='M80 18 q28 20 0 38 q-28 -18 0 -38'/><path d='M80 142 q28 -20 0 -38 q-28 18 0 38'/><path d='M18 80 q20 28 38 0 q-18 -28 -38 0'/><path d='M142 80 q-20 28 -38 0 q18 -28 38 0'/><circle cx='80' cy='80' r='9'/><circle cx='22' cy='22' r='8'/><circle cx='138' cy='138' r='8'/><circle cx='138' cy='22' r='8'/><circle cx='22' cy='138' r='8'/></g></svg>") repeat;background-size:170px 170px;border-radius:6px;display:flex;direction:ltr;padding:4px;position:relative;box-shadow:inset 0 0 15px rgba(90,50,10,.4)}
.half{width:47%;display:flex;gap:2px}
.bar{width:7%;margin:0 1%;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 0 6px rgba(0,0,0,.4);background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 48'><path d='M12 2 L21 14 V34 L12 46 L3 34 V14 Z' fill='%23c0c0c0' stroke='%23606060' stroke-width='2'/><path d='M12 10 L17 17 V31 L12 38 L7 31 V17 Z' fill='%238f8f8f'/><circle cx='12' cy='24' r='3' fill='%23404040'/></svg>") center 10%/68% auto no-repeat,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 48'><path d='M12 2 L21 14 V34 L12 46 L3 34 V14 Z' fill='%23c0c0c0' stroke='%23606060' stroke-width='2'/><path d='M12 10 L17 17 V31 L12 38 L7 31 V17 Z' fill='%238f8f8f'/><circle cx='12' cy='24' r='3' fill='%23404040'/></svg>") center 50%/68% auto no-repeat,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 48'><path d='M12 2 L21 14 V34 L12 46 L3 34 V14 Z' fill='%23c0c0c0' stroke='%23606060' stroke-width='2'/><path d='M12 10 L17 17 V31 L12 38 L7 31 V17 Z' fill='%238f8f8f'/><circle cx='12' cy='24' r='3' fill='%23404040'/></svg>") center 90%/68% auto no-repeat,linear-gradient(90deg,#c8a05e,#ecd29b 50%,#c8a05e)}
.column{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.point{height:46%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer}
.point.bottom{flex-direction:column-reverse}
.point.selected{outline:3px solid #ff0;outline-offset:-3px;border-radius:4px}
.point.valid-move::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:#2ecc71;border-radius:50%;z-index:5;box-shadow:0 0 8px #2ecc71;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.tri{position:absolute;top:0;left:6%;right:6%;bottom:0;z-index:0;background:center/100% 100% no-repeat}
.tri.a{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 200' preserveAspectRatio='none'><g fill='none' stroke='%233d85a8'><path stroke-width='3' d='M20 4 L31 34 V150 L20 196 L9 150 V34 Z'/><path stroke-width='2' d='M20 26 L26 44 V140 L20 172 L14 140 V44 Z'/><path stroke-width='2' d='M20 62 L24 76 V120 L20 138 L16 120 V76 Z'/></g><path d='M20 92 l6 10 -6 10 -6 -10 Z' fill='%233d85a8'/></svg>")}
.tri.b{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 200' preserveAspectRatio='none'><g fill='none' stroke='%235a3a1a'><path stroke-width='3' d='M20 4 L31 34 V150 L20 196 L9 150 V34 Z'/><path stroke-width='2' d='M20 26 L26 44 V140 L20 172 L14 140 V44 Z'/><path stroke-width='2' d='M20 62 L24 76 V120 L20 138 L16 120 V76 Z'/></g><path d='M20 92 l6 10 -6 10 -6 -10 Z' fill='%235a3a1a'/></svg>")}
.point.bottom .tri{transform:rotate(180deg)}
.checker{width:100%;aspect-ratio:1;max-width:32px;border-radius:50%;z-index:2;margin:1px 0;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 3px rgba(0,0,0,.55),inset 0 -3px 4px rgba(0,0,0,.35),inset 0 3px 4px rgba(255,255,255,.35)}
.checker::after{content:'❋';font-size:15px}
.checker.w{background:radial-gradient(circle at 35% 30%,#d6ffe3,#41d97e 45%,#12934c 78%,#0b6330);border:3px solid #1e88e5;color:#075e2c}
.checker.b{background:radial-gradient(circle at 35% 30%,#ffe3c2,#ff9d3c 45%,#e05114 78%,#9c2a08);border:3px solid #c62828;color:#8c1d06}
.checker.mini{max-width:none;width:92%;height:10px;border-radius:3px;margin:1px 0;border-width:2px}
.checker.mini::after{display:none}
/* دکمه سبز وسط تخته */
#roll-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;display:none}
#roll-overlay button{background:linear-gradient(#8be26b,#2f9e2f 60%,#1d7a1d);border:2px solid #145414;color:#fff;font-family:Tahoma;font-weight:bold;font-size:17px;padding:11px 24px;border-radius:9px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 1px 2px rgba(0,0,0,.4);animation:pulse 1.2s infinite}
/* دکمه‌های پایین */
#undo-btn{position:absolute;bottom:10px;left:10px;z-index:50}
#chat-btn{position:absolute;bottom:10px;right:10px;z-index:50}
#chat-panel{position:absolute;bottom:64px;right:10px;z-index:60;background:#16213e;border:1px solid #c9a227;border-radius:10px;padding:8px;display:none;flex-direction:column;gap:5px}
#chat-panel button{background:#0f3460;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-family:Tahoma;cursor:pointer}
#toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:#c9a227;color:#111;padding:8px 16px;border-radius:20px;font-weight:bold;display:none;z-index:70;box-shadow:0 3px 10px rgba(0,0,0,.5)}
/* مودال‌ها */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center}
.modal .box{background:#1a1c29;border:2px solid #c9a227;border-radius:14px;padding:20px;width:85%;max-width:320px;text-align:center}
.btn{padding:9px 16px;background:#e67e22;color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:Tahoma;font-weight:bold;margin:4px}
.btn-green{background:#27ae60}
#status-msg{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;color:#ffd700;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:12px;z-index:40;white-space:nowrap}
#table-bar{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:40;background:linear-gradient(#a1663a,#7a4526);border:2px solid #4e2c17;border-radius:12px;padding:4px 14px;font-size:12px;font-weight:bold;color:#ffe0b2;box-shadow:0 3px 8px rgba(0,0,0,.5);white-space:nowrap}

/* ===== تالار بازی (لابی) ===== */
#lobby{position:absolute;inset:0;z-index:300;background:#7a3520 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><g fill='none' stroke='%235d2413' stroke-width='3' opacity='.55'><circle cx='110' cy='110' r='34'/><path d='M110 40 q26 26 0 52 q-26 -26 0 -52'/><path d='M110 180 q26 -26 0 -52 q-26 26 0 52'/><path d='M40 110 q26 26 52 0 q-26 -26 -52 0'/><path d='M180 110 q-26 26 -52 0 q26 -26 52 0'/><circle cx='30' cy='30' r='12'/><circle cx='190' cy='190' r='12'/><circle cx='190' cy='30' r='12'/><circle cx='30' cy='190' r='12'/></g></svg>") repeat;background-size:220px 220px;color:#fff;font-family:Tahoma;overflow:hidden}
#lobby .topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;direction:ltr}
.lv-avatar{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 50% 32%,#4a2c17,#201007);border:2px solid #8a5a2a;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;box-shadow:0 5px 0 -2px #c9861f,0 8px 12px rgba(0,0,0,.5)}
.lv-badge{position:absolute;top:-8px;right:-12px;background:radial-gradient(circle at 35% 30%,#9ed1ff,#1976d2);border:2px solid #fff;border-radius:12px;padding:1px 8px;font-size:12px;font-weight:bold;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.lv-name{background:linear-gradient(#d7ccc8,#a1887f);color:#3e2723;border:2px solid #6d4c41;border-radius:8px;padding:2px 12px;font-weight:bold;font-size:13px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.lv-bar{width:150px;height:14px;background:#8d6e63;border:2px solid #5d4037;border-radius:8px;overflow:hidden}
.lv-bar i{display:block;height:100%;background:linear-gradient(#90caf9,#1976d2)}
.cur-pill{display:flex;align-items:center;gap:5px;background:linear-gradient(#efebe9,#bcaaa4);border:2px solid #6d4c41;border-radius:10px;padding:3px 10px;color:#3e2723;font-weight:bold;font-size:14px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.cur-pill .plus{color:#2e7d32;font-size:15px;font-weight:bold}
.menu-btn{width:44px;height:44px;background:linear-gradient(#efebe9,#bcaaa4);border:2px solid #6d4c41;border-radius:10px;font-size:20px;color:#3e2723;cursor:pointer}
#lv-stage{position:absolute;top:13%;bottom:24%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:4%;direction:ltr}
.lv-side{width:16%;max-width:140px;height:70%;border-radius:10px;border:3px solid rgba(0,0,0,.35);box-shadow:0 10px 18px rgba(0,0,0,.45);cursor:pointer;position:relative;transform:perspective(700px) rotateY(28deg)}
.lv-side.right{transform:perspective(700px) rotateY(-28deg)}
.lv-side .tname{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap}
.lv-side .lockpill{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(40,40,40,.88);border-radius:8px;padding:3px 8px;font-size:11px;color:#ffd54f;white-space:nowrap}
.lv-center{display:flex;flex-direction:column;align-items:center;gap:6px}
.lv-title{font-size:16px;font-weight:bold;color:#fff;text-shadow:0 2px 4px #000}
.lv-boardwrap{filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.lv-pedestal{width:240px;height:56px;background:radial-gradient(ellipse at 50% 30%,#c9861f,#8a5a12 60%,#5d3c0a);border-radius:50%;box-shadow:0 0 44px 14px rgba(255,190,80,.35),inset 0 6px 10px rgba(255,255,255,.35);margin-top:-24px}
.entry-pill{background:linear-gradient(#a1663a,#7a4526);border:2px solid #4e2c17;border-radius:12px;padding:6px 16px;font-size:14px;font-weight:bold;color:#ffe0b2;box-shadow:0 3px 8px rgba(0,0,0,.5)}
#lv-bottom{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;direction:ltr}
.lv-bigbtn{background:linear-gradient(#ffd54f,#f9a825 60%,#e65100);border:3px solid #8a4a00;border-radius:14px;padding:12px 34px;font-size:18px;font-weight:bold;color:#4e2c00;cursor:pointer;box-shadow:0 5px 0 #7a3c00,0 8px 14px rgba(0,0,0,.5);font-family:Tahoma}
.lv-smallbtn{background:linear-gradient(#ffd54f,#f9a825);border:3px solid #8a4a00;border-radius:14px;padding:8px 18px;font-weight:bold;color:#4e2c00;cursor:pointer;box-shadow:0 4px 0 #7a3c00,0 6px 10px rgba(0,0,0,.4);font-family:Tahoma;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lv-smallbtn .ic{font-size:24px;line-height:1}
.lv-lvl{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9ed1ff,#1976d2);border:2px solid #fff;font-size:12px;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.5);flex:none}
input.lv-name{background:linear-gradient(#d7ccc8,#a1887f);color:#3e2723;border:2px solid #6d4c41;border-radius:8px;padding:3px 12px;font-weight:bold;font-size:13px;font-family:Tahoma;width:140px;box-shadow:0 2px 4px rgba(0,0,0,.4);outline:none}
.lv-lottery{position:absolute;right:10px;top:34%;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;z-index:5}
.lottery-icon{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9f6ca,#2e7d32 60%,#1b5e20);border:3px solid #ffd54f;color:#fff;font-size:28px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px 5px rgba(46,204,113,.45),0 4px 8px rgba(0,0,0,.5);text-shadow:0 2px 3px rgba(0,0,0,.6);animation:pulse 1.8s infinite}
.lottery-label{font-size:11px;font-weight:bold;color:#ffe082;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px;white-space:nowrap}
.entry-pill{cursor:pointer;animation:pulse 1.6s infinite}

/* Classic board — no ornaments */
body{background:#291b14}
#board{background:#dfbd83!important;padding:5px;gap:0}
#board-frame{background:linear-gradient(90deg,#69402a,#a06a40,#69402a)!important;border:3px solid #482b1b;padding:8px}
.bar{background:#805231!important;width:6%;margin:0 1%;flex-shrink:0}
.half{width:46%;gap:2px}
.tray{background:#533622!important;cursor:pointer}
.tri{left:2%;right:2%;background-image:none!important;clip-path:polygon(0 0,100% 0,50% 100%)}
.tri.a{background:#783b28!important}.tri.b{background:#f5dfb2!important}
.checker{flex-shrink:0;width:90%;max-width:36px;transition:transform .15s}
.checker::after{content:'';width:65%;height:65%;border-radius:50%;border:1px solid #ffffff35}
.checker.w{background:radial-gradient(circle at 35% 30%,#fff9eb,#e4d5b7 70%,#b29b73);border:1px solid #b39a72;color:#443020}
.checker.b{background:radial-gradient(circle at 35% 30%,#62605b,#272622 70%,#12110f);border:1px solid #111;color:#fff}
.point.selected{outline:2px solid #f9c45b;background:#ffe39633}
.point.valid-move{background:#68bb5133;outline:1px solid #74b65b}
.point.bottom.valid-move::before{top:auto;bottom:4px}
.tray.valid-bear{outline:3px solid #8bd463;background:#5a7937!important}
.corner-btns{left:8px;right:auto}.audio-controls{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:50}
.gold-btn{width:34px;height:34px;font-size:22px;background:#d8b779;border:1px solid #71502e;box-shadow:0 2px 5px #0005;color:#382718}
.audio-btn{position:relative}.audio-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.audio-btn.muted:after{content:'';position:absolute;width:28px;height:3px;background:#9c3025;transform:rotate(-45deg);border:1px solid #e9cd9c}
#status-msg{max-width:80%;font-size:11px;white-space:normal;width:max-content;color:#f4e5ce}
#table-bar{max-width:75%;font-size:11px;padding:4px 10px}
#game{padding-top:42px;padding-bottom:34px}
.dbox{background:#f8efd9;color:#35291d;font-size:25px;line-height:27px}
#roll-overlay button{background:#6c472b;border-color:#d6b57b;font-size:14px;animation:none;padding:9px 16px}
#toast{z-index:400;font-size:12px}
@keyframes rollShake{25%{transform:rotate(20deg)}75%{transform:rotate(-20deg)}}
.rolling .dbox{animation:rollShake .12s infinite}

</style>
</head>
<body>
<div id="rotator">
<div id="lobby">
    <div class="topbar">
        <div style="display:flex;align-items:center;gap:8px">
            <div class="lv-avatar" id="lv-av">😎</div>
            <div style="display:flex;flex-direction:column;gap:5px">
                <div style="display:flex;align-items:center;gap:4px">
                    <span class="lv-lvl" id="lv-lvl">۱۳</span>
                    <div class="lv-bar"><i style="width:40%"></i></div>
                </div>
                <input class="lv-name" id="lv-name" maxlength="14" dir="rtl" style="text-align:center" onchange="myName=this.value;render()">
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
            <div class="cur-pill"><span class="plus">✚</span><span id="lv-coins">۰</span>🪙</div>
        </div>
    </div>
    <div class="lv-lottery" onclick="showToast('🎁 لاتاری روزانه به‌زودی!')">
        <div class="lottery-icon">$</div>
        <div class="lottery-label">لاتاری روزانه</div>
    </div>

        <div class="lv-side left" id="lv-left" onclick="sidePick(-1)"></div>

            <div class="lv-boardwrap" id="lv-board"></div>

    </div>
</div>

<div class="corner-btns"><button class="gold-btn" aria-label="بازگشت به تالار" onclick="leaveGame()">←</button></div>
<div class="audio-controls">
<button id="music-toggle" class="gold-btn audio-btn" aria-label="موسیقی" onclick="toggleAudio('music')"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg></button>
<button id="sound-toggle" class="gold-btn audio-btn" aria-label="صدای بازی" onclick="toggleAudio('sound')"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8q5 4 0 8M19 5q8 7 0 14"/></svg></button>
</div>
<div id="my-id-display" style="display:none"></div>
<div id="table-bar" style="display:none"></div>

<div id="game">
    <!-- پنل من -->
    <div class="panel me">
        <div class="dice-row"><div class="dbox" id="md1"></div><div class="dbox" id="md2"></div></div>
        <div class="pname" id="me-name">من</div>
        <div class="avatar" id="av-me">؟<span class="flag" id="me-lvl">۱۳</span></div>
        <div class="offcount" id="me-off">خارج: ۰</div>
            </div>

    <!-- تخته -->
    <div id="board-frame">
        <div class="tray" id="tray-w"></div>
        <div id="board">
            <div id="roll-overlay"><button onclick="doRoll()">تاس ریختن</button></div>
        </div>
        <div class="tray" id="tray-b"></div>
    </div>

    <!-- پنل حریف -->
    <div class="panel opp">
        <div class="dice-row"><div class="dbox" id="od1"></div><div class="dbox" id="od2"></div></div>
        <div class="pname" id="opp-name">حریف</div>
        <div class="avatar" id="av-opp">؟<span class="flag" id="opp-lvl">۱۳</span></div>
        <div class="offcount" id="opp-off">خارج: ۰</div>
    </div>
</div>



<div id="toast"></div>

<!-- مودال پایان بازی -->
<div class="modal" id="gameover-modal" style="display:none">
    <div class="box">
        <h2 id="result-text">🏆</h2>
        <button class="btn btn-green" onclick="rematch()">🔄 بازی مجدد</button>
    </div>
</div>
</div>

<script>
const DICE_FACES=['','⚀','⚁','⚂','⚃','⚄','⚅'];
const FA=n=>n.toString().replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

let myName="بازیکن";
let myAvatar="😎";

let peer=null,conn=null,myColor='w',myId='';
if(!peer)setStatus("⚠️ کتابخانهٔ اتصال بارگذاری نشد");
let opp={name:"حریف",avatar:"👤"};
let scores={w:0,b:0};
let myLevel=13, coins=5000000, gems=10, curTable=0;
let gameState='CONNECTING'; // CONNECTING, OPENING, PLAYING, GAMEOVER
let openingDice={w:null,b:null};
let board=Array(24).fill(null).map(()=>({color:null,count:0}));
let bar={w:0,b:0},off={w:0,b:0};
let turn='w',diceMoves=[],selectedIndex=null,validMoves=[];
let hitInHomeThisTurn=null;
let history=[];
let lastRoll=null; // {by, d:[d1,d2]}
let autoRolling=false;

if(peer)peer.on('open',id=>{myId=id;document.getElementById('my-id-display').innerText="کد شما: "+id;setStatus("کد خود را برای حریف بفرستید");});
function copyId(){navigator.clipboard.writeText(myId);alert("کد کپی شد! برای حریفت بفرست");}

if(peer)peer.on('connection',c=>{conn=c;myColor='w';setupConn();conn.on('open',()=>conn.send({type:'INIT',name:myName,avatar:myAvatar,lvl:myLevel}));});
function connectToFriend(){
    if(!peer)return;
    let fid=document.getElementById('peer-id-input').value.trim();
    if(!fid)return alert("کد حریف را وارد کنید");
    conn=peer.connect(fid);myColor='b';setupConn();
    conn.on('open',()=>conn.send({type:'INIT',name:myName,avatar:myAvatar,lvl:myLevel}));
}

function setupConn(){
    conn.on('data',data=>{
        if(data.type==='INIT'){
            opp.name=data.name;opp.avatar=data.avatar;opp.lvl=data.lvl||13;
            if(document.getElementById('setup-modal'))document.getElementById('setup-modal').style.display='none';
            gameState='OPENING';setStatus("برای شروع، تاس بریزید!");render();
        }
        else if(data.type==='OPEN_ROLL'){
            openingDice[data.color]=data.val;checkOpening();render();
        }
        else if(data.type==='SYNC'){
            board=data.board;bar=data.bar;off=data.off;turn=data.turn;
            diceMoves=data.diceMoves;lastRoll=data.lastRoll;scores=data.scores;
            selectedIndex=null;validMoves=[];autoRolling=false;
            render();maybeAutoRoll();
        }
        else if(data.type==='CHAT'){showToast(opp.name+": "+data.msg);}
        else if(data.type==='REMATCH'){resetGame();}
    });
}

function setStatus(m){document.getElementById('status-msg').innerText=m;}
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function toggleChat(){let p=document.getElementById('chat-panel');p.style.display=p.style.display==='flex'?'none':'flex';}
function sendChat(m){if(conn)conn.send({type:'CHAT',msg:m});showToast("شما: "+m);toggleChat();}
function changeName(){
    myName=prompt("نام جدید:",myName)||myName;
    myAvatar=prompt("ایموجی جدید:",myAvatar)||myAvatar;
    if(conn)conn.send({type:'INIT',name:myName,avatar:myAvatar,lvl:myLevel});render();
}

// چیدمان
function set(p,c,n){board[p-1]={color:c,count:n};}
function initBoard(){
    board=Array(24).fill(null).map(()=>({color:null,count:0}));
    bar={w:0,b:0};off={w:0,b:0};
    set(1,'b',2);set(6,'w',5);set(8,'w',3);set(12,'b',5);
    set(13,'w',5);set(17,'b',3);set(19,'b',5);set(24,'w',2);
}
initBoard();

// تاس
function doRoll(){
    if(!conn)return;
    if(gameState==='OPENING'){
        if(openingDice[myColor]!==null)return;
        let v=Math.floor(Math.random()*6)+1;
        openingDice[myColor]=v;
        conn.send({type:'OPEN_ROLL',color:myColor,val:v});
        checkOpening();render();
    }
    else if(gameState==='PLAYING'){
        if(turn!==myColor||diceMoves.length>0)return;
        let d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
        diceMoves=(d1===d2)?[d1,d1,d1,d1]:[d1,d2];
        lastRoll={by:myColor,d:[d1,d2]};
        hitInHomeThisTurn=null;history=[];
        sync();
    }
}

function checkOpening(){
    if(openingDice.w&&openingDice.b){
        if(openingDice.w===openingDice.b){openingDice={w:null,b:null};setStatus("مساوی شد! دوباره");}
        else{
            turn=openingDice.w>openingDice.b?'w':'b';
            diceMoves=[openingDice.w,openingDice.b];
            lastRoll={by:turn,d:[openingDice.w,openingDice.b]};
            gameState='PLAYING';
            setStatus(turn===myColor?"شما شروع می‌کنید!":"حریف شروع می‌کند");
        }
    }
}

function maybeAutoRoll(){
    let elAR=document.getElementById('auto-roll');let auto=elAR&&elAR.checked;
    if(!auto||autoRolling)return;
    let needRoll=(gameState==='OPENING'&&openingDice[myColor]===null)||(gameState==='PLAYING'&&turn===myColor&&diceMoves.length===0);
    if(needRoll){autoRolling=true;setTimeout(()=>{doRoll();autoRolling=false;},900);}
}
document.addEventListener('change',e=>{if(e.target.id==='auto-roll')maybeAutoRoll();});

// کلیک روی خانه‌ها
function handleClick(idx){
    if(turn!==myColor||gameState!=='PLAYING'||diceMoves.length===0)return;
    if(bar[turn]>0){enterFromBar(idx);return;}
    if(selectedIndex===null){
        if(board[idx].color===turn){
            if(hitInHomeThisTurn===idx){showToast("⛔ فرار ممنوع! مهره‌ای که در خانه خودی زده‌اید نمی‌تواند فرار کند");return;}
            selectedIndex=idx;calcValid(idx);
        }
    }else{
        if(validMoves.includes(idx)){execMove(selectedIndex,idx);selectedIndex=null;validMoves=[];sync();}
        else if(board[idx].color===turn){
            if(hitInHomeThisTurn===idx){showToast("⛔ فرار ممنوع!");return;}
            selectedIndex=idx;calcValid(idx);
        }
        else{selectedIndex=null;validMoves=[];}
    }
    render();
}

function enterFromBar(t){
    let step=turn==='w'?(24-t):(t+1);
    let di=diceMoves.indexOf(step);
    if(di===-1)return;
    if(board[t].count>1&&board[t].color!==turn)return;
    snapshot();
    if(board[t].count===1&&board[t].color!==turn){bar[board[t].color]++;board[t].count=0;}
    board[t].color=turn;board[t].count++;bar[turn]--;
    diceMoves.splice(di,1);sync();
}

function calcValid(f){
    validMoves=[];
    let dir=turn==='w'?-1:1;
    let canBear=checkCanBear();
    diceMoves.forEach(s=>{
        let t=f+(s*dir);
        if(t>=0&&t<24){if(board[t].count<=1||board[t].color===turn)validMoves.push(t);}
        else if(canBear){
            if((turn==='w'&&f+1===s)||(turn==='b'&&24-f===s)){bearOff(f,s);}
        }
    });
}

function checkCanBear(){
    if(bar[turn]>0)return false;
    let st=turn==='w'?0:18,en=turn==='w'?5:23,c=0;
    for(let i=st;i<=en;i++)if(board[i].color===turn)c+=board[i].count;
    return(c+off[turn])===15;
}

function bearOff(f,s){
    snapshot();
    board[f].count--;if(board[f].count===0)board[f].color=null;
    off[turn]++;diceMoves.splice(diceMoves.indexOf(s),1);
    selectedIndex=null;validMoves=[];sync();
}

function execMove(f,t){
    snapshot();
    let step=Math.abs(t-f);
    diceMoves.splice(diceMoves.indexOf(step),1);
    let isHome=turn==='w'?(t>=0&&t<=5):(t>=18&&t<=23);
    if(board[t].count===1&&board[t].color!==turn){
        bar[board[t].color]++;board[t].count=0;
        if(isHome)hitInHomeThisTurn=t;
    }
    board[t].color=turn;board[t].count++;
    board[f].count--;if(board[f].count===0)board[f].color=null;
}

function snapshot(){history.push(JSON.stringify({board,bar,off,diceMoves,hitInHomeThisTurn}));}
function undoMove(){
    if(turn!==myColor||gameState!=='PLAYING'||history.length===0){showToast("چیزی برای برگشت نیست");return;}
    let s=JSON.parse(history.pop());
    board=s.board;bar=s.bar;off=s.off;diceMoves=s.diceMoves;hitInHomeThisTurn=s.hitInHomeThisTurn;
    selectedIndex=null;validMoves=[];sync();showToast("↩ برگشت");
}

function sync(){
    if(diceMoves.length===0&&lastRoll){turn=turn==='w'?'b':'w';hitInHomeThisTurn=null;lastRoll=null;history=[];}
    checkGameOver();
    if(conn)conn.send({type:'SYNC',board,bar,off,turn,diceMoves,lastRoll,scores});
    render();
}

function checkGameOver(){
    if(off.w===15||off.b===15){
        gameState='GAMEOVER';
        let winner=off.w===15?'w':'b';
        let mars=(winner==='w'?off.b:off.w)===0;
        scores[winner]+=mars?2:1;
        if(winner===myColor){coins+=TABLES[curTable].prize;showToast("🪙 جایزه برد: +"+FAm(TABLES[curTable].prize));}
        let wName=winner===myColor?myName:opp.name;
        document.getElementById('result-text').innerHTML=mars?("🏆 "+wName+"<br><span style='color:#ffd700'>مارس! +۲ امتیاز</span>"):("🏆 "+wName+" برنده شد! +۱ امتیاز");
        document.getElementById('gameover-modal').style.display='flex';
    }
}

function rematch(){
    if(conn)conn.send({type:'REMATCH'});
    resetGame();
}
function resetGame(){
    document.getElementById('gameover-modal').style.display='none';
    initBoard();openingDice={w:null,b:null};diceMoves=[];lastRoll=null;history=[];
    selectedIndex=null;validMoves=[];hitInHomeThisTurn=null;
    gameState='OPENING';setStatus("برای شروع، تاس بریزید!");render();
}

// رندر
function render(){
    // تخته
    let b=document.getElementById('board');
    b.querySelectorAll('.half,.bar').forEach(e=>e.remove());
    // اگر مهره روی بار داریم، خانه‌های ورود مجاز را نشان بده
    if(gameState==='PLAYING'&&turn===myColor&&bar[turn]>0&&diceMoves.length>0){
        validMoves=[];
        diceMoves.forEach(s=>{let t=turn==='w'?24-s:s-1;if(board[t].count<=1||board[t].color===turn)validMoves.push(t);});
    }
    b.insertBefore(makeHalf([13,14,15,16,17,18],[12,11,10,9,8,7]),b.firstChild);
    let barDiv=document.createElement('div');barDiv.className='bar';
    for(let i=0;i<bar.w;i++){let c=document.createElement('div');c.className='checker w';barDiv.appendChild(c);}
    for(let i=0;i<bar.b;i++){let c=document.createElement('div');c.className='checker b';barDiv.appendChild(c);}
    b.appendChild(barDiv);
    b.appendChild(makeHalf([19,20,21,22,23,24],[6,5,4,3,2,1]));
    // سینی‌ها
    let tw=document.getElementById('tray-w');tw.innerHTML='';
    for(let i=0;i<off.w;i++){let c=document.createElement('div');c.className='checker mini w';tw.appendChild(c);}
    let tb=document.getElementById('tray-b');tb.innerHTML='';
    for(let i=0;i<off.b;i++){let c=document.createElement('div');c.className='checker mini b';tb.appendChild(c);}
    // پنل‌ها
    let oppColor=myColor==='w'?'b':'w';
    document.getElementById('me-name').innerText=myName;
    document.getElementById('opp-name').innerText=opp.name;
    document.getElementById('av-me').childNodes[0].textContent=myAvatar;
    document.getElementById('av-opp').childNodes[0].textContent=opp.avatar;
    document.getElementById('me-off').innerText="خارج: "+FA(off[myColor]||0);
    document.getElementById('opp-off').innerText="خارج: "+FA(off[oppColor]||0);
    document.getElementById('av-me').classList.toggle('glow',turn===myColor&&gameState==='PLAYING');
    document.getElementById('av-opp').classList.toggle('glow',turn!==myColor&&gameState==='PLAYING');
    document.getElementById('me-lvl').innerText=FA(myLevel);
    document.getElementById('opp-lvl').innerText=FA(opp.lvl||13);
    // تاس‌ها
    let rl=lastRoll&&lastRoll.d;
    let f1=rl?DICE_FACES[lastRoll.d[0]]:'',f2=rl?DICE_FACES[lastRoll.d[1]]:'';
    let mine=rl&&lastRoll.by===myColor;
    document.getElementById('md1').innerText=mine?f1:'';
    document.getElementById('md2').innerText=mine?f2:'';
    document.getElementById('od1').innerText=(!mine&&rl)?f1:'';
    document.getElementById('od2').innerText=(!mine&&rl)?f2:'';
    // دکمهٔ تاس وسط تخته
    let needRoll=(gameState==='OPENING'&&openingDice[myColor]===null)||(gameState==='PLAYING'&&turn===myColor&&diceMoves.length===0&&lastRoll===null);
    document.getElementById('roll-overlay').style.display=needRoll?'block':'none';
    // پیام وضعیت
    if(gameState==='OPENING')setStatus(openingDice[myColor]===null?"🎲 برای شروع، تاس بریزید":"منتظر تاس حریف...");
    else if(gameState==='PLAYING')setStatus(turn===myColor?(bar[myColor]>0?"⚠️ اول مهرهٔ روی بار را وارد کنید":(diceMoves.length>0?"نوبت شماست — یک مهره را انتخاب کنید":"🎲 نوبت شماست — تاس بریزید")):"⏳ نوبت "+opp.name+"...");
    maybeAutoRoll();
}

function makeHalf(tops,bots){
    let h=document.createElement('div');h.className='half';
    for(let i=0;i<6;i++){
        let col=document.createElement('div');col.className='column';
        col.appendChild(makePoint(tops[i],'top'));
        col.appendChild(makePoint(bots[i],'bottom'));
        h.appendChild(col);
    }
    return h;
}

function makePoint(p,pos){
    let idx=p-1,st=board[idx];
    let d=document.createElement('div');
    d.className='point '+pos+(selectedIndex===idx?' selected':'')+(validMoves.includes(idx)?' valid-move':'');
    d.onclick=()=>handleClick(idx);
    let tri=document.createElement('div');
    tri.className='tri '+(p%2?'a':'b');
    tri.style.backgroundImage=(p%2?themeTriA:themeTriB);
    d.appendChild(tri);
    let n=st.count||0,mini=n>5;
    for(let k=0;k<n;k++){
        let c=document.createElement('div');
        c.className='checker '+st.color+(mini?' mini':'');
        d.appendChild(c);
    }
    return d;
}

render();

  board:['#f3d290','#b8860b','#3e2723','#8a5a00'],

<script>
// Local classic backgammon. White moves 24 -> 1; black moves 1 -> 24.
let session=0, busy=false, botTimer=null;

function audioReady(){try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();}catch(e){}}
function tone(freq,duration=.1,volume=.04){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);}

function updateAudio(){for(const [k,v] of [['music',musicOn],['sound',soundOn]]){let el=document.getElementById(k+'-toggle');el.classList.toggle('muted',!v);el.setAttribute('aria-pressed',String(v));el.title=(k==='music'?'موسیقی':'صدای بازی')+(v?' روشن':' خاموش');}clearInterval(musicTimer);if(musicOn && document.getElementById('lobby').style.display==='none'){audioReady();musicTimer=setInterval(()=>tone([220,277.18,329.63,277.18,246.94,293.66,369.99,293.66][noteIndex++%8],.65,.012),550);}}
function toggleAudio(k){if(k==='music')musicOn=!musicOn;else soundOn=!soundOn;try{localStorage.setItem('bg-music',musicOn);localStorage.setItem('bg-sound',soundOn);}catch(e){}updateAudio();}
function stateCopy(s){return {board:s.board.map(p=>({...p})),bar:{...s.bar},off:{...s.off}};}
function position(){return {board,bar,off};}
function rawMoves(s,c,d){
 const moves=[],dir=c==='w'?-1:1;
 const open=t=>s.board[t].color===c||s.board[t].count<2;
 if(s.bar[c]){const to=c==='w'?24-d:d-1;if(open(to))moves.push({from:-1,to,die:d});return moves;}
 const home=s.board.every((p,i)=>p.color!==c||!p.count||(c==='w'?i<6:i>=18));
 s.board.forEach((p,from)=>{if(p.color!==c||!p.count)return;const to=from+dir*d;
 if(to>=0&&to<24){if(open(to))moves.push({from,to,die:d});}
 else if(home){const distance=c==='w'?from+1:24-from;
 const farther=s.board.some((q,i)=>q.color===c&&q.count&&(c==='w'?i>from:i<from));
 if(d===distance||(d>distance&&!farther))moves.push({from,to:24,die:d});}
 });return moves;
}
function moved(s,c,m){let n=stateCopy(s);if(m.from===-1)n.bar[c]--;else{let p=n.board[m.from];if(--p.count===0)p.color=null;}
 if(m.to===24)n.off[c]++;else{let p=n.board[m.to];if(p.count===1&&p.color!==c){n.bar[p.color]++;p.count=0;}p.color=c;p.count++;}return n;}
function maxPlayable(s,c,ds){if(!ds.length)return 0;let best=0;for(const d of new Set(ds)){let rem=ds.slice();rem.splice(rem.indexOf(d),1);for(const m of rawMoves(s,c,d)){best=Math.max(best,1+maxPlayable(moved(s,c,m),c,rem));if(best===ds.length)return best;}}return best;}
function legalMoves(){let s=position(),best=0,all=[];for(const d of new Set(diceMoves)){let rem=diceMoves.slice();rem.splice(rem.indexOf(d),1);for(const m of rawMoves(s,turn,d)){let n=1+maxPlayable(moved(s,turn,m),turn,rem);if(n>best){best=n;all=[];}if(n===best)all.push(m);}}
 // When only one of two different dice can be used, the higher die is compulsory.
 if(best===1&&diceMoves.length===2&&diceMoves[0]!==diceMoves[1]&&all.length){const high=Math.max(...all.map(m=>m.die));all=all.filter(m=>m.die===high);}return all;}
function die(){let v=new Uint32Array(1);do{crypto.getRandomValues(v);}while(v[0]>=4294967292);return v[0]%6+1;}
function finishIfWon(){if(off.w!==15&&off.b!==15)return false;gameState='GAMEOVER';let winner=off.w===15?'w':'b',loser=winner==='w'?'b':'w';let points=1;if(off[loser]===0){points=2;if(bar[loser]||board.some((p,i)=>p.color===loser&&(winner==='w'?i<6:i>=18)))points=3;}scores[winner]+=points;
 document.getElementById('result-text').textContent=(winner==='w'?'🏆 شما برنده شدید':'حریف کامپیوتری برنده شد')+' — '+FA(points)+' امتیاز';document.getElementById('gameover-modal').style.display='flex';return true;}
function advance(){selectedIndex=null;validMoves=[];if(finishIfWon()){render();return;}

function perform(m){let n=moved(position(),turn,m);board=n.board;bar=n.bar;off=n.off;diceMoves.splice(diceMoves.indexOf(m.die),1);sfx();advance();}

 if(!legalMoves().length)advance();else{render();scheduleBot();}},500);}
doRoll=function(){if(busy||gameState==='GAMEOVER')return;if(gameState==='OPENING'||(turn==='w'&&!diceMoves.length))rollFor('w');};
handleClick=function(idx){if(busy||gameState!=='PLAYING'||turn!=='w'||!diceMoves.length)return;const moves=legalMoves();if(bar.w){const m=moves.find(m=>m.from===-1&&m.to===idx);if(m)perform(m);else showToast('اول مهرهٔ زده‌شده را در خانهٔ مجاز وارد کنید');return;}
 const m=moves.find(m=>m.from===selectedIndex&&m.to===idx);if(m){perform(m);return;}
 if(board[idx].color==='w'&&moves.some(m=>m.from===idx)){selectedIndex=idx;validMoves=moves.filter(m=>m.from===idx&&m.to!==24).map(m=>m.to);}else{selectedIndex=null;validMoves=[];}render();};

};
makePoint=function(p,pos){let idx=p-1,st=board[idx],el=document.createElement('div');el.dataset.point=idx;el.className='point '+pos+(selectedIndex===idx?' selected':'');el.onclick=()=>handleClick(idx);el.title='خانه '+FA(p)+' — '+FA(st.count)+' مهره';let tri=document.createElement('div');tri.className='tri '+(p%2?'a':'b');el.appendChild(tri);
